<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Resultados críticos del benchmark de cuatro modelos Workers AI</title>
  <desc id="desc">En ocho casos de texto por modelo, Llama 4 Scout acertó formato, decisión y categoría en cuatro; Mistral Small 3.1 en tres; Llama 3.3 70B en dos; y GPT-OSS 20B en uno. Prueba del 7 de agosto de 2026, no tasa de error en producción.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fff9ed"/><stop offset="1" stop-color="#f7eddf"/></linearGradient>
    <pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r="1" fill="#916f52" opacity=".07"/></pattern>
  </defs>
  <rect width="1000" height="1000" fill="url(#paper)"/>
  <rect width="1000" height="1000" fill="url(#grain)"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="80" y="138" font-size="65" font-weight="750" fill="#252a2a">8 casos. 4 candidatos.</text>
    <text x="80" y="193" font-size="29" fill="#625e58">Aciertos críticos: JSON + decisión + categoría</text>
    <path d="M80 230 H920" stroke="#d6c7b6" stroke-width="2"/>

    <text x="80" y="301" font-size="38" font-weight="650" fill="#323331">Llama 4 Scout</text>
    <text x="920" y="301" font-size="46" font-weight="750" text-anchor="end" fill="#477f76">4/8</text>
    <rect x="80" y="331" width="840" height="40" rx="8" fill="#ecdfce"/>
    <rect x="80" y="331" width="420" height="40" rx="8" fill="#86bdb0"/>

    <text x="80" y="453" font-size="38" font-weight="650" fill="#323331">Mistral Small 3.1</text>
    <text x="920" y="453" font-size="46" font-weight="750" text-anchor="end" fill="#aa8041">3/8</text>
    <rect x="80" y="483" width="840" height="40" rx="8" fill="#ecdfce"/>
    <rect x="80" y="483" width="315" height="40" rx="8" fill="#e8bf75"/>

    <text x="80" y="605" font-size="38" font-weight="650" fill="#323331">Llama 3.3 70B</text>
    <text x="920" y="605" font-size="46" font-weight="750" text-anchor="end" fill="#af6158">2/8</text>
    <rect x="80" y="635" width="840" height="40" rx="8" fill="#ecdfce"/>
    <rect x="80" y="635" width="210" height="40" rx="8" fill="#db8c7b"/>

    <text x="80" y="757" font-size="38" font-weight="650" fill="#323331">GPT-OSS 20B</text>
    <text x="920" y="757" font-size="46" font-weight="750" text-anchor="end" fill="#807b73">1/8</text>
    <rect x="80" y="787" width="840" height="40" rx="8" fill="#ecdfce"/>
    <rect x="80" y="787" width="105" height="40" rx="8" fill="#aaa59d"/>

    <path d="M80 877 H920" stroke="#d6c7b6" stroke-width="2"/>
    <text x="80" y="923" font-size="26" fill="#625e58">Spike del 7 ago 2026 · 8 casos por modelo</text>
    <text x="80" y="960" font-size="26" fill="#625e58">Prueba acotada, no medición en producción.</text>
  </g>
</svg>
