<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Resultados de 82 hilos revisados en la auditoría del 5 de agosto</title>
  <desc id="desc">44 hilos con al menos un hallazgo de calidad o escalación evitable, 24 con manejo esperado, 12 con escalación necesaria sin otro hallazgo y 2 con evidencia insuficiente. Conteos por hilo, no por mensaje.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fff9ed"/><stop offset="1" stop-color="#f7eddf"/></linearGradient>
    <pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r="1" fill="#916f52" opacity=".07"/></pattern>
  </defs>
  <rect width="1000" height="1000" fill="url(#paper)"/>
  <rect width="1000" height="1000" fill="url(#grain)"/>
  <text x="80" y="143" font-family="Inter, Arial, sans-serif" font-size="110" font-weight="750" fill="#252a2a">82</text>
  <text x="270" y="113" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="650" fill="#252a2a">hilos revisados</text>
  <text x="272" y="160" font-family="Inter, Arial, sans-serif" font-size="25" fill="#625e58">Auditoría de 7 días · 5 ago 2026</text>
  <path d="M80 207 H920" stroke="#d6c7b6" stroke-width="2"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="80" y="293" font-size="32" font-weight="600" fill="#323331">Con hallazgos</text>
    <text x="916" y="293" font-size="40" font-weight="700" text-anchor="end" fill="#af6158">44</text>
    <rect x="80" y="320" width="840" height="38" rx="8" fill="#ecdfce"/>
    <rect x="80" y="320" width="840" height="38" rx="8" fill="#db8c7b"/>

    <text x="80" y="442" font-size="32" font-weight="600" fill="#323331">Manejo esperado</text>
    <text x="916" y="442" font-size="40" font-weight="700" text-anchor="end" fill="#578d81">24</text>
    <rect x="80" y="469" width="840" height="38" rx="8" fill="#ecdfce"/>
    <rect x="80" y="469" width="458" height="38" rx="8" fill="#86bdb0"/>

    <text x="80" y="591" font-size="32" font-weight="600" fill="#323331">Escalación necesaria</text>
    <text x="916" y="591" font-size="40" font-weight="700" text-anchor="end" fill="#aa8041">12</text>
    <rect x="80" y="618" width="840" height="38" rx="8" fill="#ecdfce"/>
    <rect x="80" y="618" width="229" height="38" rx="8" fill="#e8bf75"/>

    <text x="80" y="740" font-size="32" font-weight="600" fill="#323331">Evidencia insuficiente</text>
    <text x="916" y="740" font-size="40" font-weight="700" text-anchor="end" fill="#807b73">2</text>
    <rect x="80" y="767" width="840" height="38" rx="8" fill="#ecdfce"/>
    <rect x="80" y="767" width="38" height="38" rx="8" fill="#aaa59d"/>

    <path d="M80 864 H920" stroke="#d6c7b6" stroke-width="2"/>
    <text x="80" y="911" font-size="23" fill="#625e58">Barras relativas al grupo mayor (44). Unidad: hilo.</text>
    <text x="80" y="947" font-size="23" fill="#625e58">Un hallazgo basta; esto no mide fallos por mensaje.</text>
  </g>
</svg>
