<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">A cleaning-service request mistaken for a job enquiry</title>
  <desc id="desc">A card showing apartment buildings enters the classifier, receives the wrong hiring label, and ends in a fixed rejection reply. Anonymous illustration based on the audit.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fff9ef"/><stop offset="1" stop-color="#f9eee0"/></linearGradient>
    <linearGradient id="building" x2="1" y2="1"><stop stop-color="#d4e9e7"/><stop offset="1" stop-color="#9dc9bf"/></linearGradient>
    <linearGradient id="envelope" x2="1" y2="1"><stop stop-color="#f2b4a0"/><stop offset="1" stop-color="#df8f7e"/></linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#856847" flood-opacity=".18"/></filter>
    <pattern id="paper-lines" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M0 32 H32" stroke="#c2a887" stroke-opacity=".09"/></pattern>
  </defs>
  <rect width="1400" height="800" fill="url(#paper)"/>
  <rect width="1400" height="800" fill="url(#paper-lines)"/>
  <circle cx="128" cy="132" r="126" fill="#f2dfbd" opacity=".37"/>
  <circle cx="1300" cy="696" r="185" fill="#d8ebe4" opacity=".39"/>
  <path d="M413 395 H569 M826 395 H982" stroke="#d5b976" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 27"/>
  <g filter="url(#lift)" transform="rotate(-5 254 388)">
    <path d="M113 202 H394 Q412 202 412 222 V548 Q412 568 394 568 H113 Q94 568 94 548 V222 Q94 202 113 202Z" fill="url(#building)" stroke="#88b5b0" stroke-width="3"/>
    <path d="M156 458 V310 L227 276 V458 M246 458 V243 L347 289 V458" fill="#eaf5ec" stroke="#76aba2" stroke-width="5"/>
    <path d="M176 343 H205 M176 387 H205 M267 308 H298 M314 308 H330 M267 355 H298 M314 355 H330 M267 405 H298 M314 405 H330" stroke="#92beb3" stroke-width="18" stroke-linecap="round"/>
    <path d="M183 458 H351" stroke="#69a297" stroke-width="9" stroke-linecap="round"/>
    <path d="M135 276 L141 259 L158 253 L141 247 L135 230 L129 247 L112 253 L129 259Z" fill="#fff9e8"/>
  </g>
  <g filter="url(#lift)">
    <circle cx="700" cy="385" r="156" fill="#dce9ed" stroke="#b3cfd1" stroke-width="4"/>
    <circle cx="700" cy="385" r="102" fill="#fef8ee" stroke="#9fbfc2" stroke-width="4"/>
    <path d="M644 348 H748 M644 385 H728 M644 422 H701" stroke="#8aafb7" stroke-width="17" stroke-linecap="round"/>
    <path d="M780 481 L831 528" stroke="#91b9ba" stroke-width="25" stroke-linecap="round"/>
    <g transform="rotate(9 704 543)">
      <path d="M579 502 H833 L848 577 H594Z" fill="#e2a491" stroke="#c98073" stroke-width="3"/>
      <text x="710" y="555" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="43" font-weight="750" fill="#fff9eb" letter-spacing="2">HIRING</text>
    </g>
  </g>
  <g filter="url(#lift)" transform="rotate(5 1145 395)">
    <rect x="984" y="238" width="324" height="310" rx="10" fill="url(#envelope)" stroke="#c77a6e" stroke-width="4"/>
    <path d="M984 255 L1145 404 L1308 255" fill="none" stroke="#f7dcc4" stroke-width="7"/>
    <path d="M984 529 L1082 428 M1308 529 L1208 428" fill="none" stroke="#f7dcc4" stroke-width="7"/>
    <circle cx="1145" cy="417" r="53" fill="#f9ecdb" stroke="#d39378" stroke-width="3"/>
    <path d="M1123 395 L1167 439 M1167 395 L1123 439" stroke="#b65b54" stroke-width="12" stroke-linecap="round"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="45" font-weight="650" fill="#333c39" text-anchor="middle">
    <text x="253" y="662">SERVICE</text>
    <text x="700" y="662">WRONG LABEL</text>
    <text x="1145" y="662">FIXED REPLY</text>
  </g>
</svg>
