<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">De una intención entendida a una acción autorizada</title>
  <desc id="desc">Una nota de conversación llega a una puerta de verificación; sólo una ficha validada continúa hacia una acción confirmada. La ruta no autorizada queda detenida.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fff9ed"/><stop offset="1" stop-color="#f9eedd"/></linearGradient>
    <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#d5eaf0"/><stop offset="1" stop-color="#a9cdd8"/></linearGradient>
    <linearGradient id="mint" x2="1" y2="1"><stop stop-color="#bfe4db"/><stop offset="1" stop-color="#78b6a9"/></linearGradient>
    <linearGradient id="coral" x2="1" y2="1"><stop stop-color="#efaa91"/><stop offset="1" stop-color="#d77869"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#805d44" flood-opacity=".17"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#805d44" flood-opacity=".15"/></filter>
    <filter id="texture" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".5" numOctaves="3" seed="3" stitchTiles="stitch" result="noise"/><feColorMatrix in="noise" type="saturate" values="0"/></filter>
    <pattern id="lines" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M0 36h36" stroke="#bc9c7a" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#paper)"/>
  <rect width="1600" height="900" fill="url(#lines)"/>
  <circle cx="144" cy="181" r="125" fill="#f4e1bd" opacity=".42"/>
  <circle cx="1471" cy="756" r="183" fill="#d5ebe3" opacity=".33"/>
  <!-- The model suggests a meaning; it does not cross the boundary itself. -->
  <path d="M400 430 C530 407 590 367 673 387" fill="none" stroke="#7aa6aa" stroke-width="15" stroke-linecap="round" stroke-dasharray="2 31" opacity=".65"/>
  <path d="M938 393 C1057 353 1093 372 1184 430" fill="none" stroke="#e4b55f" stroke-width="15" stroke-linecap="round" stroke-dasharray="2 31" opacity=".75"/>
  <path d="M800 628 C794 690 896 718 973 697" fill="none" stroke="#d88778" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 27" opacity=".65"/>
  <!-- Conversation: a soft paper speech card, no literal customer message. -->
  <g filter="url(#shadow)" transform="rotate(-6 311 430)">
    <path d="M126 253 Q126 226 154 226 H452 Q482 226 482 254 V506 Q482 534 454 534 H295 L219 598 L229 534 H154 Q126 534 126 506Z" fill="url(#blue)" stroke="#93b7bf" stroke-width="3"/>
    <path d="M169 285 H405 M169 338 H366 M169 391 H389" stroke="#679ba8" stroke-width="18" stroke-linecap="round" opacity=".75"/>
    <circle cx="359" cy="464" r="9" fill="#fff9ed" opacity=".9"/>
    <circle cx="385" cy="464" r="9" fill="#fff9ed" opacity=".9"/>
    <circle cx="411" cy="464" r="9" fill="#fff9ed" opacity=".9"/>
  </g>
  <!-- Boundary: one physical checkpoint with a visible lock and verification key. -->
  <g filter="url(#shadow)">
    <path d="M642 222 H955 L916 258 H679Z" fill="#a8cec5"/>
    <rect x="655" y="249" width="285" height="392" rx="17" fill="url(#mint)" stroke="#70aa9f" stroke-width="3"/>
    <path d="M700 290 H895 V600 H700Z" fill="#fdf7e9" stroke="#9dbdb1" stroke-width="3"/>
    <rect x="734" y="373" width="130" height="125" rx="13" fill="#82bdad"/>
    <path d="M764 373 V344 A35 35 0 0 1 834 344 V373" fill="none" stroke="#588f84" stroke-width="19" stroke-linecap="round"/>
    <circle cx="799" cy="417" r="14" fill="#fff6df"/>
    <path d="M799 429 V457" stroke="#fff6df" stroke-width="13" stroke-linecap="round"/>
    <path d="M699 287 V598 M897 287 V598" stroke="#e0f1dc" stroke-width="7" opacity=".7"/>
    <path d="M655 641 H940 L967 668 H628Z" fill="#70a99e"/>
  </g>
  <!-- A small verification token has to fit the gate before an effect is released. -->
  <g filter="url(#soft)" transform="rotate(12 819 602)">
    <rect x="774" y="541" width="91" height="81" rx="13" fill="#f7d58d" stroke="#d7a94f" stroke-width="3"/>
    <circle cx="820" cy="580" r="22" fill="#fff9ed"/>
    <path d="M806 580 L817 591 L835 571" fill="none" stroke="#5c9a8d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- The verified effect lives beyond the checkpoint. -->
  <g filter="url(#shadow)" transform="rotate(6 1290 443)">
    <path d="M1164 241 H1361 L1426 306 V620 H1164Z" fill="#fff8e9" stroke="#e7ce9d" stroke-width="3"/>
    <path d="M1361 241 V306 H1426" fill="#f0dbb6" stroke="#e7ce9d" stroke-width="3"/>
    <path d="M1208 342 H1352 M1208 386 H1338 M1208 430 H1299" stroke="#c8ad91" stroke-width="13" stroke-linecap="round" opacity=".65"/>
    <circle cx="1293" cy="534" r="64" fill="#add8c9"/>
    <path d="M1259 534 L1284 558 L1326 509" fill="none" stroke="#508c7c" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Rejected shortcut: it remains on the near side rather than pretending to be an effect. -->
  <g filter="url(#soft)" transform="rotate(-9 1008 708)">
    <rect x="959" y="657" width="98" height="99" rx="12" fill="url(#coral)" stroke="#c16e65" stroke-width="3"/>
    <path d="M984 682 L1032 731 M1032 682 L984 731" stroke="#fff4dd" stroke-width="12" stroke-linecap="round"/>
  </g>
  <rect width="1600" height="900" filter="url(#texture)" opacity=".055" style="mix-blend-mode:multiply"/>
</svg>
