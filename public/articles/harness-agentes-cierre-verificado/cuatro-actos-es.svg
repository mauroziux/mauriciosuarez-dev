<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="cuatro-actos-title cuatro-actos-desc">
  <title id="cuatro-actos-title">cuatro-actos</title>
  <desc id="cuatro-actos-desc">Cuatro actos del proyecto y la suposición que corrigió cada uno.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a8a8a8"/></marker></defs>
  <rect width="900" height="560" fill="#111111"/>
<text x="50" y="56" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="650" fill="#E14B64" text-anchor="start" letter-spacing="1.5">CUATRO ACTOS</text><text x="50" y="98" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#ececec" text-anchor="start">Cada uno corrigió una suposición del anterior.</text><text x="50" y="126" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#a8a8a8" text-anchor="start">Los commits son el registro de auditoría.</text><line x1="90" y1="160" x2="90" y2="500" stroke="#2a2a2a" stroke-width="2"/><circle cx="90" cy="180" r="8" fill="#E14B64"/><text x="130" y="176" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650" fill="#E14B64" text-anchor="start" letter-spacing="1">AGOSTO</text><text x="130" y="204" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="650" fill="#ececec" text-anchor="start">Runtime y observabilidad</text><text x="130" y="230" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#a8a8a8" text-anchor="start">Haz visible lo que ya pasa.</text><circle cx="90" cy="270" r="8" fill="#E14B64"/><text x="130" y="266" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650" fill="#E14B64" text-anchor="start" letter-spacing="1">OCTUBRE TEMPRANO</text><text x="130" y="294" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="650" fill="#ececec" text-anchor="start">Flujo y planificación</text><text x="130" y="320" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#a8a8a8" text-anchor="start">Separa routing, profundidad y protocolo.</text><circle cx="90" cy="360" r="8" fill="#E14B64"/><text x="130" y="356" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650" fill="#E14B64" text-anchor="start" letter-spacing="1">OCTUBRE MEDIO</text><text x="130" y="384" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="650" fill="#ececec" text-anchor="start">Evidencia y entrega</text><text x="130" y="410" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#a8a8a8" text-anchor="start">Un PASS de código no acredita completado.</text><circle cx="90" cy="450" r="8" fill="#E14B64"/><text x="130" y="446" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650" fill="#E14B64" text-anchor="start" letter-spacing="1">OCTUBRE FINAL</text><text x="130" y="474" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="650" fill="#ececec" text-anchor="start">Cierre y memoria</text><text x="130" y="500" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#a8a8a8" text-anchor="start">El problema era la definición de «terminado».</text><text x="50" y="540" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#a8a8a8" text-anchor="start">Lo que no sobrevivió también es parte de la historia.</text></svg>
