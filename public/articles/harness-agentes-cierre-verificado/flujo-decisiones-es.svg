<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1150" viewBox="0 0 900 1150" role="img" aria-labelledby="flow-title flow-desc"><title id="flow-title">Dónde se decide, y con qué evidencia.</title><desc id="flow-desc">Cinco puertas: routing del modelo; contrato y ruta de la tarea; jueces del plan; verificación con checks nativos y jueces opcionales; entrega con PR en borrador y aprobación humana. El color indica quién decide: regla del harness, modelo con contexto fresco o persona.</desc><style>svg{font-family:Inter, Arial, sans-serif;}.card{fill:#181818;stroke:#2a2a2a;stroke-width:1.5;}.hi{fill:none;stroke-width:2;}.halo{opacity:.12;}.line{font-size:17.5px;letter-spacing:.1px;}.badge{font-size:11.5px;font-weight:700;letter-spacing:1.1px;}.num{font-size:13px;font-weight:700;}.title{font-size:23px;font-weight:650;fill:#ececec;letter-spacing:.2px;}.rail{stroke:#2b2b2b;stroke-width:2;}.railhot{stroke-width:2;stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:0;}.card-anim,.head-anim,.legend-anim,.foot-anim{opacity:1;}.hi{opacity:.55;}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes cardIn{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}@keyframes headIn{from{opacity:0;translate:0 8px}to{opacity:1;translate:0 0}}@keyframes drawIn{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes hi1{0%{opacity:.55}2.5%{opacity:1}9%,100%{opacity:.55}}@keyframes halo1{0%{opacity:.12;transform:scale(1)}2.5%{opacity:.5;transform:scale(1.28)}8%,100%{opacity:.12;transform:scale(1)}}@keyframes hi2{0%{opacity:.55}2.5%{opacity:1}9%,100%{opacity:.55}}@keyframes halo2{0%{opacity:.12;transform:scale(1)}2.5%{opacity:.5;transform:scale(1.28)}8%,100%{opacity:.12;transform:scale(1)}}@keyframes hi3{0%{opacity:.55}2.5%{opacity:1}9%,100%{opacity:.55}}@keyframes halo3{0%{opacity:.12;transform:scale(1)}2.5%{opacity:.5;transform:scale(1.28)}8%,100%{opacity:.12;transform:scale(1)}}@keyframes hi4{0%{opacity:.55}2.5%{opacity:1}9%,100%{opacity:.55}}@keyframes halo4{0%{opacity:.12;transform:scale(1)}2.5%{opacity:.5;transform:scale(1.28)}8%,100%{opacity:.12;transform:scale(1)}}@keyframes hi5{0%{opacity:.55}2.5%{opacity:1}9%,100%{opacity:.55}}@keyframes halo5{0%{opacity:.12;transform:scale(1)}2.5%{opacity:.5;transform:scale(1.28)}8%,100%{opacity:.12;transform:scale(1)}}@media (prefers-reduced-motion: no-preference){.head-anim{animation:headIn .8s ease-out both;}.legend-anim{animation:fadeIn .6s ease-out .35s both;}.foot-anim{animation:fadeIn .8s ease-out 10.6s both;}.card-anim.c1{animation:cardIn 1.3s cubic-bezier(.2,.7,.2,1) 0.80s both;}.hi.h1{animation:hi1 18.0s linear 1.15s infinite;}.halo.ha1{animation:halo1 18.0s linear 1.15s infinite;transform-box:fill-box;transform-origin:center;}.card-anim.c2{animation:cardIn 1.3s cubic-bezier(.2,.7,.2,1) 2.70s both;}.hi.h2{animation:hi2 18.0s linear 3.05s infinite;}.halo.ha2{animation:halo2 18.0s linear 3.05s infinite;transform-box:fill-box;transform-origin:center;}.card-anim.c3{animation:cardIn 1.3s cubic-bezier(.2,.7,.2,1) 4.60s both;}.hi.h3{animation:hi3 18.0s linear 4.95s infinite;}.halo.ha3{animation:halo3 18.0s linear 4.95s infinite;transform-box:fill-box;transform-origin:center;}.card-anim.c4{animation:cardIn 1.3s cubic-bezier(.2,.7,.2,1) 6.50s both;}.hi.h4{animation:hi4 18.0s linear 6.85s infinite;}.halo.ha4{animation:halo4 18.0s linear 6.85s infinite;transform-box:fill-box;transform-origin:center;}.card-anim.c5{animation:cardIn 1.3s cubic-bezier(.2,.7,.2,1) 8.40s both;}.hi.h5{animation:hi5 18.0s linear 8.75s infinite;}.halo.ha5{animation:halo5 18.0s linear 8.75s infinite;transform-box:fill-box;transform-origin:center;}.railhot.r1{animation:drawIn .6s ease-out 2.50s both;}.railhot.r2{animation:drawIn .6s ease-out 4.40s both;}.railhot.r3{animation:drawIn .6s ease-out 6.30s both;}.railhot.r4{animation:drawIn .6s ease-out 8.20s both;}}</style><rect width="900" height="1150" fill="#111111"/><g class="head-anim"><text x="52" y="54" font-size="14" font-weight="700" fill="#c9a052" text-anchor="start" letter-spacing="2.4">EL FLUJO DE DECISIÓN</text><text x="52" y="96" font-size="28" font-weight="700" fill="#ececec" text-anchor="start" letter-spacing="0.2">Dónde se decide, y con qué evidencia.</text><text x="52" y="124" font-size="17.5" font-weight="400" fill="#a8a8a8" text-anchor="start">Cinco puertas antes de que algo se pueda llamar terminado.</text></g><g class="legend-anim"><circle cx="58" cy="151" r="5" fill="#c9a052"/><text x="70" y="156" font-size="14.5" font-weight="400" fill="#a8a8a8" text-anchor="start">Regla del harness</text><circle cx="216.3" cy="151" r="5" fill="#7FA8D9"/><text x="228.3" y="156" font-size="14.5" font-weight="400" fill="#a8a8a8" text-anchor="start">Modelo con contexto fresco</text><circle cx="445.70000000000005" cy="151" r="5" fill="#E14B64"/><text x="457.70000000000005" y="156" font-size="14.5" font-weight="400" fill="#a8a8a8" text-anchor="start">Persona</text></g><path class="rail" d="M26 222L26 966"/><path class="railhot r1" pathLength="1" stroke="#c9a052" opacity=".85" d="M26 222L26 408"/><path class="railhot r2" pathLength="1" stroke="#c9a052" opacity=".85" d="M26 408L26 594"/><path class="railhot r3" pathLength="1" stroke="#c9a052" opacity=".85" d="M26 594L26 780"/><path class="railhot r4" pathLength="1" stroke="#c9a052" opacity=".85" d="M26 780L26 966"/><path class="rail" d="M26 222L52 222"/><circle cx="26" cy="222" r="3" fill="#3a3a3a"/><path class="rail" d="M26 408L52 408"/><circle cx="26" cy="408" r="3" fill="#3a3a3a"/><path class="rail" d="M26 594L52 594"/><circle cx="26" cy="594" r="3" fill="#3a3a3a"/><path class="rail" d="M26 780L52 780"/><circle cx="26" cy="780" r="3" fill="#3a3a3a"/><path class="rail" d="M26 966L52 966"/><circle cx="26" cy="966" r="3" fill="#3a3a3a"/><g class="card-anim c1"><rect class="card" x="52" y="186" width="796" height="164" rx="10"/><rect class="hi h1" x="52" y="186" width="796" height="164" rx="10" stroke="#c9a052"/><circle class="halo ha1" cx="90" cy="222" r="19" fill="#c9a052"/><circle cx="90" cy="222" r="19" fill="#c9a052" fill-opacity=".14" stroke="#c9a052" stroke-opacity=".55" stroke-width="1.2"/><text x="90" y="226.5" font-size="13" font-weight="700" fill="#c9a052" text-anchor="middle" class="num">01</text><text x="122" y="231" font-size="17.5" font-weight="650" fill="#ececec" text-anchor="start" class="title">Routing — ¿quién responde?</text><text x="820" y="226" font-size="11" font-weight="700" fill="#c9a052" text-anchor="end" letter-spacing="1.1" class="badge">REGLA + CLASIFICADOR</text><text x="76" y="270" font-size="17.5" font-weight="400" fill="#cfcfcf" class="line"><tspan fill="#cfcfcf">Imagen → modelo con visión. Directo, continuación o reintento → mismo modelo.</tspan></text><text x="76" y="298" font-size="17.5" font-weight="400" fill="#cfcfcf" class="line"><tspan fill="#cfcfcf">p(complejo) ≥ 0.50 → mid · ≥ 0.85 y cupo (&lt;2) → top; lo puntúa el </tspan><tspan fill="#7FA8D9">clasificador</tspan><tspan fill="#cfcfcf">.</tspan></text><text x="76" y="326" font-size="17.5" font-weight="400" fill="#cfcfcf" class="line"><tspan fill="#cfcfcf">Sin clasificador → conserva el previo. 12 turnos mecánicos → un top baja a mid.</tspan></text></g><g class="card-anim c2"><rect class="card" x="52" y="372" width="796" height="164" rx="10"/><rect class="hi h2" x="52" y="372" width="796" height="164" rx="10" stroke="#c9a052"/><circle class="halo ha2" cx="90" cy="408" r="19" fill="#c9a052"/><circle cx="90" cy="408" r="19" fill="#c9a052" fill-opacity=".14" stroke="#c9a052" stroke-opacity=".55" stroke-width="1.2"/><text x="90" y="412.5" font-size="13" font-weight="700" fill="#c9a052" text-anchor="middle" class="num">02</text><text x="122" y="417" font-size="17.5" font-weight="650" fill="#ececec" text-anchor="start" class="title">Contrato — ¿qué clase de trabajo es?</text><text x="820" y="412" font-size="11" font-weight="700" fill="#c9a052" text-anchor="end" letter-spacing="1.1" class="badge">SEÑALES DEL HARNESS</text><text x="76" y="456" font-size="17.5" font-weight="400" fill="#cfcfcf" class="line"><tspan fill="#cfcfcf">Texto normal → sin contrato. /harness-plan → solo diseño: investiga y no implementa.</tspan></text><text x="76" y="484" font-size="17.5" font-weight="400" fill="#cfcfcf" class="line"><tspan fill="#cfcfcf">/harness-task → contrato y ruta: profunda si hay seguridad, migración o efecto externo.</tspan></text><text x="76" y="512" font-size="17.5" font-weight="400" fill="#cfcfcf" class="line"><tspan fill="#cfcfcf">Estándar si cruza módulos o hay duda; rápida en el resto. Cada ruta fija sus límites.</tspan></text></g><g class="card-anim c3"><rect class="card" x="52" y="558" width="796" height="164" rx="10"/><rect class="hi h3" x="52" y="558" width="796" height="164" rx="10" stroke="#7FA8D9"/><circle class="halo ha3" cx="90" cy="594" r="19" fill="#7FA8D9"/><circle cx="90" cy="594" r="19" fill="#7FA8D9" fill-opacity=".14" stroke="#7FA8D9" stroke-opacity=".55" stroke-width="1.2"/><text x="90" y="598.5" font-size="13" font-weight="700" fill="#7FA8D9" text-anchor="middle" class="num">03</text><text x="122" y="603" font-size="17.5" font-weight="650" fill="#ececec" text-anchor="start" class="title">Plan — ¿se aprueba el diseño?</text><text x="820" y="598" font-size="11" font-weight="700" fill="#7FA8D9" text-anchor="end" letter-spacing="1.1" class="badge">CLASIFICADOR + JUEZ FRESCO</text><text x="76" y="642" font-size="17.5" font-weight="400" fill="#cfcfcf" class="line"><tspan fill="#cfcfcf">Diseño simple → plan local, sin jueces; el estado queda NOT_RUN, nunca PASS.</tspan></text><text x="76" y="670" font-size="17.5" font-weight="400" fill="#cfcfcf" class="line"><tspan fill="#cfcfcf">Review → 1 autor y 1 juez. Paralelo → 2–3 autores, jueces y comparación.</tspan></text><text x="76" y="698" font-size="17.5" font-weight="400" fill="#cfcfcf" class="line"><tspan fill="#cfcfcf">PASS solo con cobertura completa, citas literales y ningún hueco P0/P1.</tspan></text></g><g class="card-anim c4"><rect class="card" x="52" y="744" width="796" height="164" rx="10"/><rect class="hi h4" x="52" y="744" width="796" height="164" rx="10" stroke="#c9a052"/><circle class="halo ha4" cx="90" cy="780" r="19" fill="#c9a052"/><circle cx="90" cy="780" r="19" fill="#c9a052" fill-opacity=".14" stroke="#c9a052" stroke-opacity=".55" stroke-width="1.2"/><text x="90" y="784.5" font-size="13" font-weight="700" fill="#c9a052" text-anchor="middle" class="num">04</text><text x="122" y="789" font-size="17.5" font-weight="650" fill="#ececec" text-anchor="start" class="title">Verificación — ¿hay evidencia?</text><text x="820" y="784" font-size="11" font-weight="700" fill="#c9a052" text-anchor="end" letter-spacing="1.1" class="badge">CHECKS + JUEZ OPCIONAL</text><text x="76" y="828" font-size="17.5" font-weight="400" fill="#cfcfcf" class="line"><tspan fill="#cfcfcf">Cada criterio se mapea a un check nativo: PASS, FAIL, INCONCLUSIVE o STALE.</tspan></text><text x="76" y="856" font-size="17.5" font-weight="400" fill="#cfcfcf" class="line"><tspan fill="#7FA8D9">Jueces</tspan><tspan fill="#cfcfcf"> si hay UI, señales de riesgo o profundidad deep; si no, checks.</tspan></text><text x="76" y="884" font-size="17.5" font-weight="400" fill="#cfcfcf" class="line"><tspan fill="#cfcfcf">Si el workspace cambia durante la revisión → STALE. Falla idéntica → decisión.</tspan></text></g><g class="card-anim c5"><rect class="card" x="52" y="930" width="796" height="164" rx="10"/><rect class="hi h5" x="52" y="930" width="796" height="164" rx="10" stroke="#E14B64"/><circle class="halo ha5" cx="90" cy="966" r="19" fill="#E14B64"/><circle cx="90" cy="966" r="19" fill="#E14B64" fill-opacity=".14" stroke="#E14B64" stroke-opacity=".55" stroke-width="1.2"/><text x="90" y="970.5" font-size="13" font-weight="700" fill="#E14B64" text-anchor="middle" class="num">05</text><text x="122" y="975" font-size="17.5" font-weight="650" fill="#ececec" text-anchor="start" class="title">Entrega — ¿puede salir?</text><text x="820" y="970" font-size="11" font-weight="700" fill="#E14B64" text-anchor="end" letter-spacing="1.1" class="badge">HARNESS + PERSONA</text><text x="76" y="1014" font-size="17.5" font-weight="400" fill="#cfcfcf" class="line"><tspan fill="#cfcfcf">Commit en la rama de la tarea → sí. Merge, deploy y publicar → </tspan><tspan fill="#E14B64">persona</tspan><tspan fill="#cfcfcf">.</tspan></text><text x="76" y="1042" font-size="17.5" font-weight="400" fill="#cfcfcf" class="line"><tspan fill="#cfcfcf">PR draft → PASS fresco del workspace exacto, rama no protegida y árbol limpio.</tspan></text><text x="76" y="1070" font-size="17.5" font-weight="400" fill="#cfcfcf" class="line"><tspan fill="#cfcfcf">Sin PASS, solo un draft NOT VERIFIED con instrucción humana explícita.</tspan></text></g><g class="foot-anim"><rect x="52" y="1104" width="4" height="18" rx="2" fill="#c9a052"/><text x="68" y="1118" font-size="16.5" font-weight="500" fill="#a8a8a8" text-anchor="start">Ninguna puerta activa la siguiente. Eso es el diseño.</text></g></svg>
