<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="memoria-equipo-title memoria-equipo-desc">
  <title id="memoria-equipo-title">memoria-equipo</title>
  <desc id="memoria-equipo-desc">Session A saves a learning; session B searches for it; the Worker persists it in one Durable Object per repo.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a8a8a8"/></marker></defs>
  <rect width="900" height="560" fill="#111111"/>
<text x="50" y="56" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="650" fill="#E14B64" text-anchor="start" letter-spacing="1.5">TEAM MEMORY</text><text x="50" y="98" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#ececec" text-anchor="start">One Durable Object per repo; today does not start from zero.</text><rect x="50" y="150" width="220" height="90" rx="8" fill="#181818" stroke="#2a2a2a" stroke-width="1.5"/><text x="70" y="180" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="650" fill="#ececec" text-anchor="start">Session A</text><text x="70" y="206" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#E14B64" text-anchor="start">memory_save</text><text x="70" y="226" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#a8a8a8" text-anchor="start">saves a learning</text><rect x="340" y="150" width="220" height="90" rx="8" fill="#181818" stroke="#2a2a2a" stroke-width="1.5"/><text x="360" y="180" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="650" fill="#ececec" text-anchor="start">Worker pi-memory</text><text x="360" y="206" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#c9a052" text-anchor="start">HTTP + credential</text><text x="360" y="226" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#a8a8a8" text-anchor="start">one project per repo</text><rect x="630" y="150" width="220" height="90" rx="8" fill="#181818" stroke="#2a2a2a" stroke-width="1.5"/><text x="650" y="180" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="650" fill="#ececec" text-anchor="start">Session B</text><text x="650" y="206" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#E14B64" text-anchor="start">memory_search</text><text x="650" y="226" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#a8a8a8" text-anchor="start">checks before repeating</text><path d="M270 195L340 195" fill="none" stroke="#a8a8a8" stroke-width="2.5" marker-end="url(#arrow)"/><text x="305" y="185" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#a8a8a8" text-anchor="middle">save</text><path d="M560 195L630 195" fill="none" stroke="#a8a8a8" stroke-width="2.5" marker-end="url(#arrow)"/><text x="595" y="185" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#a8a8a8" text-anchor="middle">search</text><rect x="280" y="330" width="340" height="120" rx="8" fill="#181818" stroke="#E14B64" stroke-width="1.5"/><text x="300" y="364" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="650" fill="#ececec" text-anchor="start">Durable Object per repo</text><text x="300" y="394" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#c9a052" text-anchor="start">SQLite + FTS5</text><text x="300" y="420" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" fill="#a8a8a8" text-anchor="start">isolated by project</text><path d="M450 240L450 330" fill="none" stroke="#a8a8a8" stroke-width="2.5" marker-end="url(#arrow)"/><text x="460" y="290" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#a8a8a8" text-anchor="start">HTTP</text><text x="50" y="510" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#a8a8a8" text-anchor="start">Offline: local outbox → memory_sync when the network returns.</text></svg>
