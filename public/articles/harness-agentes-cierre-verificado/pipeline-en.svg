<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-labelledby="pipeline-title pipeline-desc">
  <title id="pipeline-title">pipeline</title>
  <desc id="pipeline-desc">The path from ticket to a human-approved PR.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a8a8a8"/></marker></defs>
  <rect width="900" height="700" fill="#111111"/>
<text x="50" y="56" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="650" fill="#E14B64" text-anchor="start" letter-spacing="1.5">THE PATH</text><text x="50" y="98" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#ececec" text-anchor="start">From ticket to a human-approved PR.</text><text x="50" y="126" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#a8a8a8" text-anchor="start">Every step leaves evidence; a person approves the last one.</text><rect x="70" y="160" width="760" height="64" rx="8" fill="#181818" stroke="#2a2a2a" stroke-width="1.5"/><circle cx="100" cy="192" r="18" fill="#2a2a2a"/><text x="100" y="198" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#a8a8a8" text-anchor="middle">01</text><text x="135" y="188" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="650" fill="#ececec" text-anchor="start">Ticket</text><text x="135" y="211" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#a8a8a8" text-anchor="start">objective and scope</text><path d="M100 224L100 246" fill="none" stroke="#a8a8a8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="70" y="246" width="760" height="64" rx="8" fill="#181818" stroke="#2a2a2a" stroke-width="1.5"/><circle cx="100" cy="278" r="18" fill="#2a2a2a"/><text x="100" y="284" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#a8a8a8" text-anchor="middle">02</text><text x="135" y="274" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="650" fill="#ececec" text-anchor="start">/plan</text><text x="135" y="297" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#a8a8a8" text-anchor="start">design, questions, judges</text><path d="M100 310L100 332" fill="none" stroke="#a8a8a8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="70" y="332" width="760" height="64" rx="8" fill="#181818" stroke="#2a2a2a" stroke-width="1.5"/><circle cx="100" cy="364" r="18" fill="#2a2a2a"/><text x="100" y="370" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#a8a8a8" text-anchor="middle">03</text><text x="135" y="360" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="650" fill="#ececec" text-anchor="start">/task</text><text x="135" y="383" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#a8a8a8" text-anchor="start">implement, test, repair</text><path d="M100 396L100 418" fill="none" stroke="#a8a8a8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="70" y="418" width="760" height="64" rx="8" fill="#181818" stroke="#E14B64" stroke-width="1.5"/><circle cx="100" cy="450" r="18" fill="#E14B64"/><text x="100" y="456" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#ececec" text-anchor="middle">04</text><text x="135" y="446" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="650" fill="#ececec" text-anchor="start">review_artifact</text><text x="135" y="469" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#a8a8a8" text-anchor="start">native checks, pixels, evidence</text><path d="M100 482L100 504" fill="none" stroke="#a8a8a8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="70" y="504" width="760" height="64" rx="8" fill="#181818" stroke="#2a2a2a" stroke-width="1.5"/><circle cx="100" cy="536" r="18" fill="#2a2a2a"/><text x="100" y="542" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#a8a8a8" text-anchor="middle">05</text><text x="135" y="532" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="650" fill="#ececec" text-anchor="start">draft PR</text><text x="135" y="555" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#a8a8a8" text-anchor="start">sealed receipts, no force</text><path d="M100 568L100 590" fill="none" stroke="#a8a8a8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="70" y="590" width="760" height="64" rx="8" fill="#181818" stroke="#c9a052" stroke-width="1.5"/><circle cx="100" cy="622" r="18" fill="#c9a052"/><text x="100" y="628" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#ececec" text-anchor="middle">06</text><text x="135" y="618" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="650" fill="#ececec" text-anchor="start">Human</text><text x="135" y="641" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#a8a8a8" text-anchor="start">reviews and approves</text><text x="50" y="684" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#a8a8a8" text-anchor="start">At most three human gates; one in normal use.</text></svg>
