<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="cuatro-actos-title cuatro-actos-desc">
  <title id="cuatro-actos-title">cuatro-actos</title>
  <desc id="cuatro-actos-desc">Four acts of the project and the assumption each one corrected.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a8a8a8"/></marker></defs>
  <rect width="900" height="560" fill="#111111"/>
<text x="50" y="56" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="650" fill="#E14B64" text-anchor="start" letter-spacing="1.5">FOUR ACTS</text><text x="50" y="98" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#ececec" text-anchor="start">Each one corrected an assumption from the previous one.</text><text x="50" y="126" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#a8a8a8" text-anchor="start">The commits are the audit trail.</text><line x1="90" y1="160" x2="90" y2="500" stroke="#2a2a2a" stroke-width="2"/><circle cx="90" cy="180" r="8" fill="#E14B64"/><text x="130" y="176" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650" fill="#E14B64" text-anchor="start" letter-spacing="1">AUGUST</text><text x="130" y="204" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="650" fill="#ececec" text-anchor="start">Runtime and observability</text><text x="130" y="230" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#a8a8a8" text-anchor="start">Make visible what is already happening.</text><circle cx="90" cy="270" r="8" fill="#E14B64"/><text x="130" y="266" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650" fill="#E14B64" text-anchor="start" letter-spacing="1">EARLY OCTOBER</text><text x="130" y="294" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="650" fill="#ececec" text-anchor="start">Flow and planning</text><text x="130" y="320" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#a8a8a8" text-anchor="start">Separate routing, depth, and protocol.</text><circle cx="90" cy="360" r="8" fill="#E14B64"/><text x="130" y="356" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650" fill="#E14B64" text-anchor="start" letter-spacing="1">MID-OCTOBER</text><text x="130" y="384" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="650" fill="#ececec" text-anchor="start">Evidence and delivery</text><text x="130" y="410" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#a8a8a8" text-anchor="start">A code PASS does not certify completion.</text><circle cx="90" cy="450" r="8" fill="#E14B64"/><text x="130" y="446" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650" fill="#E14B64" text-anchor="start" letter-spacing="1">LATE OCTOBER</text><text x="130" y="474" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="650" fill="#ececec" text-anchor="start">Closure and memory</text><text x="130" y="500" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#a8a8a8" text-anchor="start">The problem was the definition of “done.”</text><text x="50" y="540" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#a8a8a8" text-anchor="start">What did not survive is part of the story too.</text></svg>
