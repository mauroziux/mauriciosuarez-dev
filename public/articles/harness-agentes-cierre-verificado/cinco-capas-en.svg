<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="cinco-capas-title cinco-capas-desc">
  <title id="cinco-capas-title">cinco-capas</title>
  <desc id="cinco-capas-desc">The five layers of pi-harness: routing, planning, execution, verification, and memory.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a8a8a8"/></marker></defs>
  <rect width="900" height="600" fill="#111111"/>
<text x="50" y="56" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="650" fill="#E14B64" text-anchor="start" letter-spacing="1.5">FIVE LAYERS</text><text x="50" y="98" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#ececec" text-anchor="start">Work and evidence in the same system.</text><rect x="70" y="140" width="760" height="72" rx="8" fill="#181818" stroke="#2a2a2a" stroke-width="1.5"/><text x="100" y="171" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#a8a8a8" text-anchor="start">01</text><text x="135" y="169" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="650" fill="#ececec" text-anchor="start">Routing</text><text x="135" y="193" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#a8a8a8" text-anchor="start">Text to GLM, vision to OpenAI, budgeted escalation.</text><rect x="70" y="226" width="760" height="72" rx="8" fill="#181818" stroke="#2a2a2a" stroke-width="1.5"/><text x="100" y="257" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#a8a8a8" text-anchor="start">02</text><text x="135" y="255" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="650" fill="#ececec" text-anchor="start">Planning</text><text x="135" y="279" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#a8a8a8" text-anchor="start">Questions, fresh judges, plan with criteria.</text><rect x="70" y="312" width="760" height="72" rx="8" fill="#181818" stroke="#2a2a2a" stroke-width="1.5"/><text x="100" y="343" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#a8a8a8" text-anchor="start">03</text><text x="135" y="341" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="650" fill="#ececec" text-anchor="start">Execution</text><text x="135" y="365" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#a8a8a8" text-anchor="start">Playbooks, guards, verifiable slices.</text><rect x="70" y="398" width="760" height="72" rx="8" fill="#181818" stroke="#E14B64" stroke-width="1.5"/><text x="100" y="429" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#E14B64" text-anchor="start">04</text><text x="135" y="427" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="650" fill="#ececec" text-anchor="start">Verification</text><text x="135" y="451" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#a8a8a8" text-anchor="start">Native checks, pixels, honest states.</text><rect x="70" y="484" width="760" height="72" rx="8" fill="#181818" stroke="#c9a052" stroke-width="1.5"/><text x="100" y="515" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#c9a052" text-anchor="start">05</text><text x="135" y="513" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="650" fill="#ececec" text-anchor="start">Memory</text><text x="135" y="537" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#a8a8a8" text-anchor="start">Per-repo learnings in a Durable Object.</text><text x="50" y="584" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#a8a8a8" text-anchor="start">The PR is the human boundary.</text></svg>
