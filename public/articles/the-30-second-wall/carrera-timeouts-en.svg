<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="The timeout race: before, the 60-second client timeout lived beyond PHP's 30-second wall, so the worker died with an uncapturable FatalError before the timeout could fire. After, the bounded 20-second timeout fires before the wall as a catchable exception that triggers the gateway failover.">
  <defs>
    <marker id="arr-ce" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#707070"/>
    </marker>
  </defs>

  <text x="40" y="30" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#707070">BEFORE · THE CLIENT TIMEOUT LIVES BEYOND THE WALL</text>

  <!-- PHP wall at 30s: timeline 0..60s mapped to 720px = 12px/s → wall at x=400 -->
  <line x1="400" y1="50" x2="400" y2="210" stroke="#9B9EF7" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="400" y="44" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#9B9EF7">PHP wall · max_execution_time · 30 s</text>

  <!-- Request bar: alive until wall, ghosted after -->
  <rect x="40" y="70" width="360" height="30" fill="#6D71F0" fill-opacity=".25" stroke="#6D71F0" stroke-opacity=".7"/>
  <rect x="400" y="70" width="360" height="30" fill="#6D71F0" fill-opacity=".06" stroke="#4a4a4a" stroke-dasharray="5 4" stroke-opacity=".6"/>
  <text x="220" y="90" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#ececec">hung Gemini call…</text>
  <text x="580" y="90" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#707070">what the client waited for</text>

  <!-- Death chip at the wall -->
  <rect x="330" y="118" width="140" height="30" rx="8" fill="#1a1b30" stroke="#6D71F0" stroke-opacity=".8"/>
  <text x="400" y="138" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#9B9EF7">✕ worker dead</text>

  <!-- SDK timeout flag at 60s (never fires) -->
  <line x1="760" y1="60" x2="760" y2="104" stroke="#707070" stroke-width="1.5"/>
  <text x="760" y="170" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#707070">SDK timeout 60 s</text>
  <text x="760" y="186" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#707070">— never fires</text>

  <text x="40" y="225" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#707070">Engine FatalError · uncapturable · supervisor restart (ERROR unknown error ×6)</text>

  <!-- Divider -->
  <line x1="40" y1="262" x2="760" y2="262" stroke="#2a2a2a"/>
  <text x="40" y="292" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#707070">AFTER · THE TIMEOUT FIRES BEFORE THE WALL</text>

  <!-- Wall reference (shorter) -->
  <line x1="400" y1="310" x2="400" y2="460" stroke="#9B9EF7" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity=".5"/>
  <text x="412" y="452" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#707070">wall 30 s</text>

  <!-- Bounded bar 0..20s -->
  <rect x="40" y="330" width="240" height="30" fill="#9B9EF7" fill-opacity=".3" stroke="#9B9EF7" stroke-opacity=".9"/>
  <text x="160" y="350" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ececec">timeout 20 s</text>
  <line x1="280" y1="322" x2="280" y2="368" stroke="#ececec" stroke-width="1.5"/>
  <text x="280" y="390" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#ececec">catchable exception</text>

  <path d="M 280 345 L 340 345" stroke="#707070" stroke-width="1.5" marker-end="url(#arr-ce)"/>

  <!-- Failover chip -->
  <rect x="350" y="326" width="250" height="38" rx="9" fill="#15162a" stroke="#6D71F0" stroke-opacity=".6"/>
  <text x="475" y="350" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#9B9EF7">gateway failover · clean 5xx</text>

  <text x="40" y="490" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#9B9EF7">Failover is code — and code needs a living process.</text>

  <text x="400" y="545" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#707070">If the client timeout ≥ PHP's limit, PHP always wins: it doesn't degrade, it kills.</text>
  <text x="400" y="569" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#707070">The cutoff must arrive before the wall — with room for the rest of the request.</text>
</svg>
