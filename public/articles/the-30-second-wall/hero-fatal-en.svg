<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Mantto postmortem: an uncapturable FatalError at 30 seconds. The AI SDK's default timeout was 60 seconds, but PHP killed the worker at 30; the fix bounds the client timeout to 20 seconds, always below the wall.">
  <defs>
    <pattern id="grid-fe" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
    <linearGradient id="line-fe" x1="0" x2="1">
      <stop offset="0" stop-color="#6D71F0"/><stop offset="1" stop-color="#9B9EF7"/>
    </linearGradient>
    <linearGradient id="panel-fe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12131c"/><stop offset="1" stop-color="#0f1014"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect width="1200" height="630" fill="url(#grid-fe)"/>
  <rect x="58" y="74" width="7" height="362" rx="3.5" fill="url(#line-fe)"/>

  <text x="94" y="112" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" letter-spacing="2.2" fill="#9B9EF7">POSTMORTEM · MANTTO · SAAS IN PRODUCTION</text>
  <text x="94" y="218" font-family="DejaVu Sans, sans-serif" font-size="76" font-weight="700" fill="#ececec">FatalError</text>
  <rect x="96" y="240" width="152" height="4" rx="2" fill="#6D71F0"/>
  <text x="94" y="296" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#a8a8a8">The 30-second wall</text>
  <text x="94" y="351" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#707070">client timeout 60 s · PHP wall 30 s · the process dies first</text>

  <rect x="94" y="392" width="242" height="43" rx="21.5" fill="#15162a" stroke="#6D71F0" stroke-opacity=".6"/>
  <text x="215" y="420" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#9B9EF7">PHP · OCTANE · LARAVEL</text>

  <rect x="735" y="76" width="370" height="360" rx="16" fill="url(#panel-fe)" stroke="#2a2a2a"/>
  <text x="770" y="116" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#707070">THE RACE · BEFORE</text>

  <text x="770" y="151" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#ececec">SDK timeout (default)</text>
  <text x="1070" y="151" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#a8a8a8">60 s</text>
  <line x1="770" y1="164" x2="1070" y2="164" stroke="#2a2a2a"/>

  <rect x="762" y="177" width="316" height="30" rx="7" fill="#1a1b30" stroke="#6D71F0" stroke-opacity=".55"/>
  <text x="778" y="197" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#ececec">PHP wall · Octane</text>
  <text x="1062" y="197" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#9B9EF7">30 s</text>
  <line x1="770" y1="221" x2="1070" y2="221" stroke="#2a2a2a"/>

  <text x="770" y="250" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#ececec">Octane worker</text>
  <text x="1070" y="250" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#a8a8a8">dead</text>

  <line x1="770" y1="272" x2="1070" y2="272" stroke="#2a2a2a"/>
  <text x="770" y="304" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="700" fill="#ececec">Uncapturable FatalError</text>
  <text x="770" y="330" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#707070">try/catch doesn't run: no process</text>

  <rect x="770" y="352" width="300" height="52" rx="12" fill="#131313" stroke="#2a2a2a"/>
  <text x="920" y="375" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#a8a8a8">AFTER: 20 s timeout — always below</text>
  <text x="920" y="393" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#a8a8a8">the wall → catchable exception</text>

  <line x1="94" y1="487" x2="1104" y2="487" stroke="#2a2a2a"/>
  <text x="94" y="537" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#9B9EF7">MANTTO</text>
  <text x="94" y="568" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#a8a8a8">property operations in production</text>
  <text x="560" y="537" font-family="DejaVu Sans Mono, monospace" font-size="31" font-weight="700" fill="#9B9EF7">60 s → 20 s</text>
  <text x="560" y="568" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#a8a8a8">client timeout · below PHP's wall</text>
  <text x="1104" y="603" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#707070">mauriciosuarez.dev · writing</text>
</svg>
