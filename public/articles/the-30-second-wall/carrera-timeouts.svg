<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="La carrera del timeout: antes, el timeout del cliente en 60 segundos quedaba más allá del muro de PHP en 30 segundos, así que el worker moría con un FatalError incapturable antes de que el timeout pudiera dispararse. Después, el timeout acotado a 20 segundos se dispara antes del muro como una excepción atrapable que activa el failover del gateway.">
  <defs>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#707070"/>
    </marker>
  </defs>

  <text x="40" y="30" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#707070">ANTES · EL TIMEOUT DEL CLIENTE VIVE MÁS ALLÁ DEL MURO</text>

  <!-- PHP wall at 30s: timeline 0..60s mapped to 720px = 12px/s → wall at x=400 -->
  <line x1="400" y1="50" x2="400" y2="210" stroke="#9B9EF7" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="400" y="44" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#9B9EF7">muro PHP · max_execution_time · 30 s</text>

  <!-- Request bar: alive until wall, ghosted after -->
  <rect x="40" y="70" width="360" height="30" fill="#6D71F0" fill-opacity=".25" stroke="#6D71F0" stroke-opacity=".7"/>
  <rect x="400" y="70" width="360" height="30" fill="#6D71F0" fill-opacity=".06" stroke="#4a4a4a" stroke-dasharray="5 4" stroke-opacity=".6"/>
  <text x="220" y="90" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#ececec">llamada a Gemini colgada…</text>
  <text x="580" y="90" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#707070">lo que el cliente esperaba</text>

  <!-- Death chip at the wall -->
  <rect x="330" y="118" width="140" height="30" rx="8" fill="#1a1b30" stroke="#6D71F0" stroke-opacity=".8"/>
  <text x="400" y="138" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#9B9EF7">✕ worker muerto</text>

  <!-- SDK timeout flag at 60s (never fires) -->
  <line x1="760" y1="60" x2="760" y2="104" stroke="#707070" stroke-width="1.5"/>
  <text x="760" y="170" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#707070">timeout SDK 60 s</text>
  <text x="760" y="186" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#707070">— nunca se dispara</text>

  <text x="40" y="225" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#707070">FatalError del engine · incapturable · reinicio del supervisor (ERROR unknown error ×6)</text>

  <!-- Divider -->
  <line x1="40" y1="262" x2="760" y2="262" stroke="#2a2a2a"/>
  <text x="40" y="292" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#707070">DESPUÉS · EL TIMEOUT SE DISPARA ANTES DEL MURO</text>

  <!-- Wall reference (shorter) -->
  <line x1="400" y1="310" x2="400" y2="460" stroke="#9B9EF7" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity=".5"/>
  <text x="412" y="452" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#707070">muro 30 s</text>

  <!-- Bounded bar 0..20s -->
  <rect x="40" y="330" width="240" height="30" fill="#9B9EF7" fill-opacity=".3" stroke="#9B9EF7" stroke-opacity=".9"/>
  <text x="160" y="350" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ececec">timeout 20 s</text>
  <line x1="280" y1="322" x2="280" y2="368" stroke="#ececec" stroke-width="1.5"/>
  <text x="280" y="390" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#ececec">excepción atrapable</text>

  <path d="M 280 345 L 340 345" stroke="#707070" stroke-width="1.5" marker-end="url(#arr-c)"/>

  <!-- Failover chip -->
  <rect x="350" y="326" width="250" height="38" rx="9" fill="#15162a" stroke="#6D71F0" stroke-opacity=".6"/>
  <text x="475" y="350" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#9B9EF7">failover del gateway · 5xx limpio</text>

  <text x="40" y="490" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#9B9EF7">El failover es código — y el código necesita un proceso vivo.</text>

  <text x="400" y="545" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#707070">Si el timeout del cliente ≥ el límite de PHP, PHP gana siempre: no degrada, mata.</text>
  <text x="400" y="569" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#707070">El corte debe llegar antes del muro — con aire para el resto del request.</text>
</svg>
