<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-label="Anatomy of the confirmation email: 10 evidence photos feed two emails (owner and reporter); each attachment triggers a sequential R2 GET, some 20 downloads in total, plus the synchronous Resend send of 5 to 15 seconds inside the original HTTP request.">
  <defs>
    <marker id="arr-ee" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#707070"/>
    </marker>
  </defs>

  <rect x="230" y="16" width="340" height="36" rx="9" fill="#0a0a0a" stroke="#2a2a2a"/>
  <text x="400" y="39" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#ececec">MaintenanceCompletedMail::build()</text>

  <text x="40" y="88" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#707070">10 EVIDENCE PHOTOS</text>
  <g fill="#131313" stroke="#2a2a2a">
    <rect x="40" y="98" width="40" height="32" rx="6"/><rect x="88" y="98" width="40" height="32" rx="6"/>
    <rect x="136" y="98" width="40" height="32" rx="6"/><rect x="184" y="98" width="40" height="32" rx="6"/>
    <rect x="232" y="98" width="40" height="32" rx="6"/>
    <rect x="40" y="138" width="40" height="32" rx="6"/><rect x="88" y="138" width="40" height="32" rx="6"/>
    <rect x="136" y="138" width="40" height="32" rx="6"/><rect x="184" y="138" width="40" height="32" rx="6"/>
    <rect x="232" y="138" width="40" height="32" rx="6"/>
  </g>
  <g fill="#707070" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">
    <text x="60" y="118">before</text><text x="108" y="118">before</text><text x="156" y="118">before</text>
    <text x="204" y="118">before</text><text x="252" y="118">before</text>
    <text x="60" y="158">after</text><text x="108" y="158">after</text><text x="156" y="158">after</text>
    <text x="204" y="158">after</text><text x="252" y="158">after</text>
  </g>

  <path d="M 286 114 L 336 114" stroke="#707070" stroke-width="1.5" marker-end="url(#arr-ee)"/>
  <path d="M 286 154 L 336 154" stroke="#707070" stroke-width="1.5" marker-end="url(#arr-ee)"/>

  <rect x="344" y="92" width="416" height="44" rx="10" fill="#131313" stroke="#2a2a2a"/>
  <text x="368" y="119" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#ececec">Email → owner</text>
  <text x="736" y="119" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="12.5" fill="#9B9EF7">10 attachments = 10 R2 GETs</text>

  <rect x="344" y="148" width="416" height="44" rx="10" fill="#131313" stroke="#2a2a2a"/>
  <text x="368" y="175" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#ececec">Email → reporter</text>
  <text x="736" y="175" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="12.5" fill="#9B9EF7">10 attachments = 10 R2 GETs</text>

  <rect x="120" y="222" width="560" height="34" rx="8" fill="#1a1b30" stroke="#6D71F0" stroke-opacity=".6"/>
  <text x="400" y="244" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#9B9EF7">≈ 20 sequential object-storage downloads hidden inside emails</text>

  <path d="M 400 256 L 400 288" stroke="#707070" stroke-width="1.5" marker-end="url(#arr-ee)"/>

  <rect x="180" y="292" width="440" height="52" rx="10" fill="#131313" stroke="#2a2a2a"/>
  <text x="210" y="323" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#ececec">Resend API · synchronous send</text>
  <text x="596" y="323" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#9B9EF7">5–15 s</text>
  <text x="400" y="368" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#707070">inside the original HTTP request</text>

  <text x="400" y="408" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#707070">A confirmation email was, in reality, an object-storage client in disguise.</text>
</svg>
