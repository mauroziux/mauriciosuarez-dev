<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Postmortem de Mantto: un endpoint de mantenimiento tardaba 29 segundos porque la transición de estado y todo el trabajo posterior corrían en la misma petición HTTP; después del fix responde en menos de 500 milisegundos.">
  <defs>
    <pattern id="grid-m" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
    <linearGradient id="line-m" x1="0" x2="1">
      <stop offset="0" stop-color="#6D71F0"/><stop offset="1" stop-color="#9B9EF7"/>
    </linearGradient>
    <linearGradient id="panel-m" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12131c"/><stop offset="1" stop-color="#0f1014"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect width="1200" height="630" fill="url(#grid-m)"/>
  <rect x="58" y="74" width="7" height="362" rx="3.5" fill="url(#line-m)"/>

  <text x="94" y="112" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" letter-spacing="2.2" fill="#9B9EF7">POSTMORTEM · MANTTO · SAAS EN PRODUCCIÓN</text>
  <text x="94" y="218" font-family="DejaVu Sans, sans-serif" font-size="76" font-weight="700" fill="#ececec">29 segundos</text>
  <rect x="96" y="240" width="152" height="4" rx="2" fill="#6D71F0"/>
  <text x="94" y="296" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#a8a8a8">El endpoint que nadie reportó</text>
  <text x="94" y="351" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#707070">1 cambio de estado · 4 trabajos en el mismo hilo HTTP</text>

  <rect x="94" y="392" width="262" height="43" rx="21.5" fill="#15162a" stroke="#6D71F0" stroke-opacity=".6"/>
  <text x="225" y="420" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#9B9EF7">LARAVEL · COLAS · R2</text>

  <rect x="735" y="76" width="370" height="360" rx="16" fill="url(#panel-m)" stroke="#2a2a2a"/>
  <text x="770" y="116" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#707070">POST /complete · ANTES</text>

  <text x="770" y="151" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#ececec">transición de estado</text>
  <text x="1070" y="151" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#a8a8a8">~ms</text>
  <line x1="770" y1="164" x2="1070" y2="164" stroke="#2a2a2a"/>

  <text x="770" y="193" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#ececec">reporte ejecutivo IA</text>
  <text x="1070" y="193" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#9B9EF7">5–15 s</text>
  <line x1="770" y1="206" x2="1070" y2="206" stroke="#2a2a2a"/>

  <text x="770" y="235" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#ececec">render PDF + R2</text>
  <text x="1070" y="235" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#9B9EF7">1–3 s</text>
  <line x1="770" y1="248" x2="1070" y2="248" stroke="#2a2a2a"/>

  <rect x="762" y="261" width="316" height="30" rx="7" fill="#1a1b30" stroke="#6D71F0" stroke-opacity=".55"/>
  <text x="778" y="281" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#ececec">emails: ~20 GETs a R2</text>
  <text x="1062" y="281" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#9B9EF7">5–15 s</text>
  <line x1="770" y1="305" x2="1070" y2="305" stroke="#2a2a2a"/>

  <text x="770" y="334" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#ececec">encuesta + WhatsApp</text>
  <text x="1070" y="334" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#a8a8a8">+s</text>

  <line x1="770" y1="356" x2="1070" y2="356" stroke="#2a2a2a"/>
  <text x="770" y="388" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="700" fill="#ececec">≈ 29 s TTFB</text>

  <rect x="770" y="402" width="188" height="30" rx="15" fill="#15162a" stroke="#6D71F0"/>
  <text x="864" y="422" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#9B9EF7">DESPUÉS · &lt;500 ms</text>

  <line x1="94" y1="487" x2="1104" y2="487" stroke="#2a2a2a"/>
  <text x="94" y="537" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#9B9EF7">MANTTO</text>
  <text x="94" y="568" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#a8a8a8">operación inmobiliaria en producción</text>
  <text x="560" y="537" font-family="DejaVu Sans Mono, monospace" font-size="31" font-weight="700" fill="#9B9EF7">29 s → &lt;500 ms</text>
  <text x="560" y="568" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#a8a8a8">TTFB del endpoint · registro interno</text>
  <text x="1104" y="603" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#707070">mauriciosuarez.dev · artículos</text>
</svg>
