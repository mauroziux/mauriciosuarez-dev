<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-label="Exact agreement between Jev and the pipeline rises with Jev’s reported confidence: 9.0% below 0.5, 17.9% from 0.5 to 0.7, 28.1% from 0.7 to 0.9, and 41.9% at 0.9 or above">
  <text x="24" y="33" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="600" fill="#ececec">Higher reported confidence, higher agreement</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a8a8a8">326 comparable responses · question set 2.2.0 · exact agreement with the pipeline’s final category</text>

  <!-- Axis guides: y-scale 0..50% mapped to bars, baseline y=330, 5px per % -->
  <line x1="64" y1="330" x2="770" y2="330" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="64" y1="205" x2="770" y2="205" stroke="#1f1f1f" stroke-width="1"/>
  <line x1="64" y1="80" x2="770" y2="80" stroke="#1f1f1f" stroke-width="1"/>

  <!-- <0.5: 9.0% (67 obs) -->
  <rect x="100" y="285" width="120" height="45" rx="4" fill="#5a2a2e"/>
  <text x="160" y="275" text-anchor="middle" font-family="Inter, ui-monospace, monospace" font-size="13" font-weight="600" fill="#ececec">9.0%</text>
  <text x="160" y="352" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#a8a8a8">&lt; 0.5</text>
  <text x="160" y="369" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#707070">67 responses</text>

  <!-- 0.5-0.7: 17.9% (78) -->
  <rect x="270" y="240.5" width="120" height="89.5" rx="4" fill="#8a3038"/>
  <text x="330" y="231" text-anchor="middle" font-family="Inter, ui-monospace, monospace" font-size="13" font-weight="600" fill="#ececec">17.9%</text>
  <text x="330" y="352" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#a8a8a8">0.5 – 0.7</text>
  <text x="330" y="369" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#707070">78 responses</text>

  <!-- 0.7-0.9: 28.1% (64) -->
  <rect x="440" y="189.5" width="120" height="140.5" rx="4" fill="#A82833"/>
  <text x="500" y="180" text-anchor="middle" font-family="Inter, ui-monospace, monospace" font-size="13" font-weight="600" fill="#ececec">28.1%</text>
  <text x="500" y="352" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#a8a8a8">0.7 – 0.9</text>
  <text x="500" y="369" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#707070">64 responses</text>

  <!-- >=0.9: 41.9% (117) -->
  <rect x="610" y="120.5" width="120" height="209.5" rx="4" fill="#C41E3A"/>
  <text x="670" y="111" text-anchor="middle" font-family="Inter, ui-monospace, monospace" font-size="13" font-weight="600" fill="#ffffff">41.9%</text>
  <text x="670" y="352" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#a8a8a8">≥ 0.9</text>
  <text x="670" y="369" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#707070">117 responses</text>

  <text x="64" y="334" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#707070">0%</text>
  <text x="64" y="209" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#707070">25%</text>
  <text x="64" y="84" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#707070">50%</text>

  <text x="24" y="399" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#707070">Reported confidence vs. agreement, not human-labeled accuracy or calibration. Pipeline fallbacks affect every bucket.</text>
</svg>
