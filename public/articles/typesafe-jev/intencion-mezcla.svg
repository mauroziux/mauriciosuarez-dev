<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="La intención mixta pasó de 15.6 por ciento con preguntas choice exclusivas a 71.4 por ciento rediseñando las preguntas con nouls, superando el gate del 70 por ciento. El modelo no cambió, el diseño sí.">
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="600" fill="#ececec">Intención mixta: el diseño de preguntas, no el modelo</text>

  <!-- Gate line at 70% -->
  <line x1="585" y1="60" x2="585" y2="236" stroke="#c9a052" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="585" y="52" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#c9a052">gate 70%</text>

  <!-- v1 bar -->
  <text x="185" y="112" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#ececec">v1 · choice exclusivo</text>
  <rect x="200" y="90" width="86" height="44" rx="6" fill="#4a4a4a"/>
  <text x="298" y="118" text-anchor="start" font-family="Inter, ui-monospace, monospace" font-size="16" font-weight="600" fill="#a8a8a8">15.6%</text>

  <!-- v2 bar -->
  <text x="185" y="205" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#ececec">v2 · nouls por familia</text>
  <rect x="200" y="183" width="393" height="44" rx="6" fill="#C41E3A"/>
  <text x="581" y="211" text-anchor="end" font-family="Inter, ui-monospace, monospace" font-size="16" font-weight="600" fill="#ffffff">71.4%</text>

  <!-- Footnote -->
  <text x="24" y="272" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#707070">Mismo modelo, misma versión, mismo corpus. Cambió el diseño de las preguntas: una distribución exclusiva dice</text>
  <text x="24" y="290" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#707070">"a qué se parece esto" — no "qué más quiere el cliente".</text>
</svg>
