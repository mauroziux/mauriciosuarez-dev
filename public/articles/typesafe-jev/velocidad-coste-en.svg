<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Recorded latency and reference costs with different measurement scopes: earlier LLM-chain p50 3.78 seconds, later p50 14.5 seconds, and successful Jev REST-call p50 0.55 seconds. Whole-turn chain cost estimated at $0.002–0.006; Jev synthetic-case cost measured at $0.000081. These do not establish equivalent-work speedups or production savings.">
  <text x="24" y="33" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="600" fill="#ececec">Recorded latency and reference costs</text>

  <!-- Panel A: latency p50, scale 0..15s mapped 150..720px (38px/s) -->
  <text x="24" y="66" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#c9a052">Recorded duration (p50; different timer scopes)</text>

  <line x1="150" y1="82" x2="150" y2="242" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="435" y1="82" x2="435" y2="242" stroke="#1f1f1f" stroke-width="1"/>
  <line x1="720" y1="82" x2="720" y2="242" stroke="#1f1f1f" stroke-width="1"/>

  <text x="135" y="117" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#ececec">LLM chain</text>
  <text x="135" y="133" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#a8a8a8">earlier segment</text>
  <rect x="150" y="102" width="144" height="22" rx="4" fill="#4a4a4a"/>
  <text x="300" y="117" font-family="Inter, ui-monospace, monospace" font-size="12.5" fill="#a8a8a8">3.78 s</text>

  <text x="135" y="177" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#ececec">LLM chain</text>
  <text x="135" y="193" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#a8a8a8">later segment*</text>
  <rect x="150" y="162" width="551" height="22" rx="4" fill="#333333"/>
  <text x="705" y="177" text-anchor="end" font-family="Inter, ui-monospace, monospace" font-size="12.5" fill="#c9a052">14.5 s</text>

  <text x="135" y="237" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#ececec">Jev</text>
  <rect x="150" y="222" width="21" height="22" rx="4" fill="#C41E3A"/>
  <text x="177" y="237" font-family="Inter, ui-monospace, monospace" font-size="12.5" font-weight="600" fill="#ffffff">0.55 s (REST call only)</text>

  <text x="150" y="260" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#707070">0 s</text>
  <text x="435" y="260" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#707070">7.5 s</text>
  <text x="720" y="260" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#707070">15 s</text>

  <!-- Panel B: cost per decision, log-ish manual scale -->
  <text x="24" y="316" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#c9a052">Cost figures (illustrative bars; not to scale)</text>

  <line x1="150" y1="332" x2="150" y2="492" stroke="#2a2a2a" stroke-width="1"/>

  <text x="135" y="367" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#ececec">LLM chain</text>
  <text x="135" y="383" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#a8a8a8">whole-turn estimate</text>
  <rect x="150" y="352" width="540" height="22" rx="4" fill="#4a4a4a"/>
  <text x="684" y="367" text-anchor="end" font-family="Inter, ui-monospace, monospace" font-size="12.5" fill="#a8a8a8">$0.002–0.006</text>

  <text x="135" y="427" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#ececec">Jev</text>
  <text x="135" y="443" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#a8a8a8">synthetic corpus</text>
  <rect x="150" y="412" width="120" height="22" rx="4" fill="#C41E3A"/>
  <text x="278" y="427" font-family="Inter, ui-monospace, monospace" font-size="12.5" font-weight="600" fill="#ffffff">$0.000081 (25–75× arithmetic ratio)</text>

  <text x="24" y="486" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#707070">* Chain: claim→pin ledger interval, including pipeline work and any retries; provider_valid completions.</text>
  <text x="24" y="504" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#707070">Jev: successful REST-call timer. The timers, cohorts, and work performed are different.</text>
  <text x="24" y="522" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#707070">Jev cost: measured over 292 synthetic cases; published price $0.042/M input tokens. No live usage stored.</text>
  <text x="24" y="540" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#707070">Chain cost: Part 1 estimate per complete turn, not classification alone. No production savings measured.</text>
</svg>
