<svg xmlns="http://www.w3.org/2000/svg" width="640" height="920" viewBox="0 0 640 920" role="img" aria-labelledby="notas-heredadas-title notas-heredadas-desc">
  <title id="notas-heredadas-title">Lo heredado es el cuaderno, no nuevos pesos</title>
  <desc id="notas-heredadas-desc">Qwen3.5-9B hereda código y notas entre intentos de setup de inferencia. El éxito fue 45 por ciento en la primera generación y entre 61 y 84 por ciento en las posteriores; los pesos no fueron reentrenados.</desc>
  <defs>
    <marker id="notas-heredadas-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#4C596A"/></marker>
    <pattern id="notas-heredadas-range" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#F4D9DF"/><path d="M0 8L8 0" stroke="#C41E3A" stroke-width="1.5"/></pattern>
  </defs>
  <rect width="640" height="920" fill="#E8EDF3"/>
  <g font-family="DejaVu Sans, sans-serif">
    <text x="40" y="44" font-size="18" letter-spacing="2" font-weight="700" fill="#4C596A">ADAPTACIÓN / MEMENTO</text>
    <text x="40" y="102" font-size="44" font-weight="700" letter-spacing="-1" fill="#17202B">Lo heredado</text>
    <text x="40" y="154" font-size="44" font-weight="700" letter-spacing="-1" fill="#17202B">es el cuaderno.</text>
    <text x="40" y="194" font-size="24" fill="#4C596A">El mismo modelo, con mejores antecedentes.</text>
    <path d="M320 310V338" fill="none" stroke="#4C596A" stroke-width="3" marker-end="url(#notas-heredadas-arrow)"/>
    <path d="M320 436V464" fill="none" stroke="#4C596A" stroke-width="3" marker-end="url(#notas-heredadas-arrow)"/>
    <rect x="40" y="230" width="560" height="80" rx="6" fill="#F7F9FC" stroke="#A8B7C7"/>
    <text x="64" y="263" font-size="26" font-weight="700" fill="#17202B">Un intento trabaja</text>
    <text x="64" y="293" font-size="22" fill="#4C596A">Configura inferencia y encuentra errores.</text>
    <path d="M40 344H576L600 368V436H40Z" fill="#F7F9FC" stroke="#C41E3A" stroke-width="2"/>
    <path d="M576 344V368H600" fill="none" stroke="#C41E3A" stroke-width="2"/>
    <text x="64" y="381" font-size="26" font-weight="700" fill="#17202B">Deja notas + código</text>
    <text x="64" y="416" font-size="22" fill="#4C596A">Estrategias probadas, fallos y hallazgos.</text>
    <rect x="40" y="470" width="560" height="80" rx="6" fill="#F7F9FC" stroke="#A8B7C7"/>
    <text x="64" y="503" font-size="26" font-weight="700" fill="#17202B">Una nueva instancia continúa</text>
    <text x="64" y="533" font-size="22" fill="#4C596A">Hereda el entorno y ese cuaderno.</text>
    <text x="40" y="600" font-size="24" font-weight="700" fill="#17202B">Éxito al levantar inferencia</text>
    <text x="40" y="632" font-size="22" fill="#4C596A">Qwen3.5-9B · seis generaciones evaluadas</text>
    <!-- Escala común 0–100%; el rayado expresa un rango, no puntos inventados. -->
    <text x="40" y="682" font-size="24" fill="#17202B">Primera generación</text>
    <text x="600" y="682" text-anchor="end" font-size="30" font-weight="700" fill="#17202B">45%</text>
    <rect x="40" y="700" width="560" height="20" rx="3" fill="#D0D9E3"/>
    <rect x="40" y="700" width="252" height="20" rx="3" fill="#4C596A"/>
    <text x="40" y="766" font-size="24" fill="#17202B">Generaciones posteriores</text>
    <text x="600" y="766" text-anchor="end" font-size="30" font-weight="700" fill="#C41E3A">61–84%</text>
    <rect x="40" y="784" width="560" height="20" rx="3" fill="#D0D9E3"/>
    <rect x="40" y="784" width="341.6" height="20" rx="3" fill="#C41E3A"/>
    <rect x="381.6" y="784" width="128.8" height="20" fill="url(#notas-heredadas-range)" stroke="#C41E3A"/>
    <text x="40" y="838" font-size="20" fill="#4C596A">Rayado: rango observado en generaciones posteriores.</text>
    <path d="M40 862H600" stroke="#A8B7C7"/>
    <text x="40" y="894" font-size="21" font-weight="700" fill="#17202B">No es tasa de infección ni reentrenamiento.</text>
  </g>
</svg>
