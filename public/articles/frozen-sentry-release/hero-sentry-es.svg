<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Postmortem de Mantto: durante semanas, seis deploys reportaban el mismo release de julio en Sentry porque un env estático pisaba todos los mecanismos de build; el fix resuelve el release en config leyendo el SOURCE_COMMIT de runtime.">
  <defs>
    <pattern id="grid-s" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
    <linearGradient id="line-s" x1="0" x2="1">
      <stop offset="0" stop-color="#6D71F0"/><stop offset="1" stop-color="#9B9EF7"/>
    </linearGradient>
    <linearGradient id="panel-s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12131c"/><stop offset="1" stop-color="#0f1014"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect width="1200" height="630" fill="url(#grid-s)"/>
  <rect x="58" y="74" width="7" height="362" rx="3.5" fill="url(#line-s)"/>

  <text x="94" y="112" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" letter-spacing="2.2" fill="#9B9EF7">POSTMORTEM · MANTTO · SAAS EN PRODUCCIÓN</text>
  <text x="94" y="218" font-family="DejaVu Sans Mono, monospace" font-size="76" font-weight="700" fill="#ececec">68f50f6</text>
  <rect x="96" y="240" width="152" height="4" rx="2" fill="#6D71F0"/>
  <text x="94" y="296" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#a8a8a8">El release congelado</text>
  <text x="94" y="351" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#707070">6 deploys · 1 release de julio · triage muerto durante semanas</text>

  <rect x="94" y="392" width="252" height="43" rx="21.5" fill="#15162a" stroke="#6D71F0" stroke-opacity=".6"/>
  <text x="220" y="420" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#9B9EF7">SENTRY · COOLIFY · DOCKER</text>

  <rect x="735" y="76" width="370" height="360" rx="16" fill="url(#panel-s)" stroke="#2a2a2a"/>
  <text x="770" y="116" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#707070">SEIS DEPLOYS · UN RELEASE</text>

  <text x="770" y="151" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#ececec">deploys posteriores</text>
  <text x="1070" y="151" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#a8a8a8">6</text>
  <line x1="770" y1="164" x2="1070" y2="164" stroke="#2a2a2a"/>

  <rect x="762" y="177" width="316" height="30" rx="7" fill="#1a1b30" stroke="#6D71F0" stroke-opacity=".55"/>
  <text x="778" y="197" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#ececec">release reportado</text>
  <text x="1062" y="197" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#9B9EF7">68f50f6</text>
  <line x1="770" y1="221" x2="1070" y2="221" stroke="#2a2a2a"/>

  <text x="770" y="250" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#ececec">commit real desplegado</text>
  <text x="1070" y="250" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#a8a8a8">varios</text>

  <line x1="770" y1="272" x2="1070" y2="272" stroke="#2a2a2a"/>
  <text x="770" y="304" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="700" fill="#ececec">triaje por deploy</text>
  <text x="770" y="330" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#707070">¿qué deploy rompió esto? — imposible</text>

  <rect x="770" y="352" width="300" height="52" rx="12" fill="#131313" stroke="#2a2a2a"/>
  <text x="920" y="375" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#a8a8a8">DESPUÉS: release resuelto en config</text>
  <text x="920" y="393" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#a8a8a8">→ SHA exacto de cada deploy</text>

  <line x1="94" y1="487" x2="1104" y2="487" stroke="#2a2a2a"/>
  <text x="94" y="537" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#9B9EF7">MANTTO</text>
  <text x="94" y="568" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#a8a8a8">operación inmobiliaria en producción</text>
  <text x="560" y="537" font-family="DejaVu Sans Mono, monospace" font-size="31" font-weight="700" fill="#9B9EF7">SHA exacto</text>
  <text x="560" y="568" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#a8a8a8">cada deploy reporta su commit (era 6 → 1)</text>
  <text x="1104" y="603" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#707070">mauriciosuarez.dev · artículos</text>
</svg>
