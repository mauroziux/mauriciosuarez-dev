<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1000" viewBox="0 0 760 1000" role="img" aria-labelledby="title desc">
  <title id="title">Otra puerta al negocio; no otro negocio detrás</title>
  <desc id="desc">El equipo utiliza Claude o ChatGPT. El servidor MCP comprueba cuenta, conexión y scopes para exponer herramientas acotadas que consultan fuentes y utilizan los caminos canónicos del backend. Los operadores leen según sus capacidades; las escrituras requieren administrador y delegación vigente.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a8a8a8"/></marker></defs>
  <rect width="760" height="1000" fill="#111111"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="40" y="56" font-size="17" letter-spacing="2" font-weight="700" fill="#E14B64">ARQUITECTURA · MALTACLEAN</text>
    <text x="40" y="108" font-size="34" font-weight="700" fill="#ececec">Otra puerta. Las mismas reglas.</text>
    <path d="M380 276V324" fill="none" stroke="#a8a8a8" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M380 444V492" fill="none" stroke="#a8a8a8" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M380 680V728" fill="none" stroke="#a8a8a8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="152" y="156" width="456" height="120" rx="8" fill="#181818" stroke="#707070"/>
    <text x="380" y="205" text-anchor="middle" font-size="32" font-weight="700" fill="#ececec">El equipo</text>
    <text x="380" y="244" text-anchor="middle" font-size="24" fill="#a8a8a8">Operadores y administradores</text>
    <rect x="112" y="332" width="536" height="112" rx="8" fill="#181818" stroke="#707070" stroke-dasharray="6 5"/>
    <text x="380" y="376" text-anchor="middle" font-size="32" font-weight="700" fill="#ececec">Claude / ChatGPT</text>
    <text x="380" y="415" text-anchor="middle" font-size="24" fill="#a8a8a8">Cliente que invoca herramientas</text>
    <rect x="56" y="500" width="648" height="180" rx="8" fill="#211016" stroke="#C41E3A" stroke-width="2"/>
    <text x="380" y="548" text-anchor="middle" font-size="36" font-weight="700" fill="#ececec">MCP con autoridad vigente</text>
    <text x="380" y="590" text-anchor="middle" font-size="24" fill="#E14B64">Cuenta + token + conexión + capacidades</text>
    <line x1="96" y1="612" x2="664" y2="612" stroke="#61303a"/>
    <text x="380" y="650" text-anchor="middle" font-size="23" fill="#ececec">Lecturas y acciones delimitadas, no SQL libre</text>
    <rect x="40" y="736" width="680" height="160" rx="8" fill="#181818" stroke="#707070"/>
    <text x="380" y="782" text-anchor="middle" font-size="32" font-weight="700" fill="#ececec">Backend existente</text>
    <text x="380" y="820" text-anchor="middle" font-size="25" fill="#a8a8a8">Conversaciones · Reservas · Precios</text>
    <text x="380" y="862" text-anchor="middle" font-size="23" fill="#a8a8a8">Validación, auditoría y deduplicación</text>
    <line x1="40" y1="932" x2="720" y2="932" stroke="#2a2a2a"/>
    <text x="40" y="967" font-size="21" fill="#a8a8a8">Operador: lectura según capacidades.</text>
    <text x="720" y="967" text-anchor="end" font-size="21" fill="#E14B64">Admin: escritura delegada.</text>
  </g>
</svg>
