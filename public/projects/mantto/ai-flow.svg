<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 620" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Mantto · from inspection to maintenance</title>
<desc id="desc">Documented Mantto flow: the inspector captures evidence, AI proposes findings as draft, human review checks evidence and state, approved maintenance keeps its evidence, and slow work continues in the background.</desc>
<rect width="620" height="620" rx="8" fill="#0a0a0a"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a8a8a8"/></marker></defs>
<g font-family="Inter, system-ui, sans-serif">
<text x="20" y="38" font-size="22" fill="#a8a8a8">Mantto · from inspection to maintenance</text>
<path d="M280 127 H335" fill="none" stroke="#a8a8a8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M470 182 V217" fill="none" stroke="#a8a8a8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M340 277 H285" fill="none" stroke="#a8a8a8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M150 332 V367" fill="none" stroke="#a8a8a8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="72" width="260" height="110" rx="20" fill="#111111" stroke="#C41E3A" stroke-width="2"/>
<text x="150" y="118" text-anchor="middle" font-size="24" font-weight="600" fill="#ececec">Field inspection</text>
<text x="150" y="145" text-anchor="middle" font-size="22" font-weight="400" fill="#a8a8a8">Evidence on site</text>
<rect x="340" y="72" width="260" height="110" rx="6" fill="#111111" stroke="#c9a052" stroke-width="2"/>
<text x="470" y="118" text-anchor="middle" font-size="24" font-weight="600" fill="#ececec">AI proposes</text>
<text x="470" y="145" text-anchor="middle" font-size="22" font-weight="400" fill="#a8a8a8">Findings as draft</text>
<rect x="340" y="222" width="260" height="110" rx="20" fill="#111111" stroke="#C41E3A" stroke-width="2"/>
<text x="470" y="268" text-anchor="middle" font-size="24" font-weight="600" fill="#ececec">Human review</text>
<text x="470" y="295" text-anchor="middle" font-size="22" font-weight="400" fill="#a8a8a8">Evidence · state</text>
<rect x="20" y="222" width="260" height="110" rx="6" fill="#111111" stroke="#4a4a4a" stroke-width="2"/>
<text x="150" y="268" text-anchor="middle" font-size="24" font-weight="600" fill="#ececec">Maintenance</text>
<text x="150" y="295" text-anchor="middle" font-size="22" font-weight="400" fill="#a8a8a8">Evidence attached</text>
<rect x="20" y="372" width="260" height="110" rx="6" fill="#111111" stroke="#c9a052" stroke-width="2"/>
<text x="150" y="418" text-anchor="middle" font-size="24" font-weight="600" fill="#ececec">In the background</text>
<text x="150" y="445" text-anchor="middle" font-size="22" font-weight="400" fill="#a8a8a8">PDF · report · notices</text>
<text x="20" y="530" font-size="22" fill="#a8a8a8">AI proposes findings;</text>
<text x="20" y="559" font-size="22" fill="#a8a8a8">the app reviews and decides.</text>
<text x="20" y="588" font-size="22" fill="#a8a8a8">Completion no longer waits for slow work.</text>
</g>
</svg>
