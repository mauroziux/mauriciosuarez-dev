<title id="title">AutoSentry · reparación elegible</title>
<desc id="desc">Flujo documentado desde Sentry al draft MR de GitLab. Los defectos fuera de alcance pasan a una persona; un control fallido detiene el intento. Agents SDK y Durable Objects orquestan el Sandbox.</desc>
