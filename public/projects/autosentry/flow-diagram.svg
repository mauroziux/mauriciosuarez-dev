<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 676" role="img" aria-labelledby="title desc" lang="en">
<title id="title">AutoSentry · eligible repair path</title>
<desc id="desc">Documented flow from Sentry to GitLab draft MR. Out-of-scope defects go to a human. Failed gates stop the attempt. Agents SDK and Durable Objects orchestrate Sandbox execution.</desc>
