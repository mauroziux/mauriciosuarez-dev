<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 676" role="img" aria-labelledby="title desc" lang="es">
<title id="title">DonMerge · ejecución de revisión</title>
<desc id="desc">Flujo simplificado: evento de GitHub, cola, Workflow, modelo en sandbox, validación, calidad y deduplicación, revisión publicada. Los reintentos de modelo y de infraestructura tienen políticas distintas.</desc>
