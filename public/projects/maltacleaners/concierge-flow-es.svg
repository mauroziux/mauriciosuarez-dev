<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 600" role="img" aria-labelledby="title desc" lang="es">
<title id="title">MaltaCleaners · Concierge por WhatsApp</title>
<desc id="desc">Flujo documentado del Concierge: un mensaje de WhatsApp se interpreta con la conversación y el catálogo autorizado; la decisión exige significado y autoridad, y deriva a un operador cuando falta alguno.</desc>
<rect width="620" height="600" rx="8" fill="#0a0a0a"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a8a8a8"/></marker></defs>
<g font-family="Inter, system-ui, sans-serif">
<text x="20" y="38" font-size="22" fill="#a8a8a8">MaltaCleaners · Concierge por WhatsApp</text>
<path d="M280 127 H335" fill="none" stroke="#a8a8a8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M470 182 V217" fill="none" stroke="#a8a8a8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M340 277 H285" fill="none" stroke="#a8a8a8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M470 332 V367" fill="none" stroke="#a8a8a8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="72" width="260" height="110" rx="20" fill="#111111" stroke="#C41E3A" stroke-width="2"/>
<text x="150" y="118" text-anchor="middle" font-size="24" font-weight="600" fill="#ececec">WhatsApp</text>
<text x="150" y="145" text-anchor="middle" font-size="22" font-weight="400" fill="#a8a8a8">Solicitud del cliente</text>
<rect x="340" y="72" width="260" height="110" rx="6" fill="#111111" stroke="#c9a052" stroke-width="2"/>
<text x="470" y="118" text-anchor="middle" font-size="24" font-weight="600" fill="#ececec">Contexto</text>
<text x="470" y="145" text-anchor="middle" font-size="22" font-weight="400" fill="#a8a8a8">Chat + catálogo</text>
<rect x="340" y="222" width="260" height="110" rx="6" fill="#111111" stroke="#4a4a4a" stroke-width="2"/>
<text x="470" y="268" text-anchor="middle" font-size="24" font-weight="600" fill="#ececec">Decisión</text>
<text x="470" y="295" text-anchor="middle" font-size="22" font-weight="400" fill="#a8a8a8">¿Contexto y permiso?</text>
<rect x="20" y="222" width="260" height="110" rx="6" fill="#111111" stroke="#4a4a4a" stroke-width="2"/>
<text x="150" y="268" text-anchor="middle" font-size="24" font-weight="600" fill="#ececec">Acción autorizada</text>
<text x="150" y="295" text-anchor="middle" font-size="22" font-weight="400" fill="#a8a8a8">Precios vigentes</text>
<rect x="340" y="372" width="260" height="110" rx="20" fill="#111111" stroke="#C41E3A" stroke-width="2"/>
<text x="470" y="418" text-anchor="middle" font-size="24" font-weight="600" fill="#ececec">Operador</text>
<text x="470" y="445" text-anchor="middle" font-size="22" font-weight="400" fill="#a8a8a8">Intervención humana</text>
<text x="20" y="510" font-size="22" fill="#a8a8a8">Sin contexto o autoridad:</text>
<text x="20" y="539" font-size="22" fill="#a8a8a8">operador, no invención.</text>
<text x="20" y="573" font-size="22" fill="#a8a8a8">Una acción refleja su estado vigente.</text>
</g>
